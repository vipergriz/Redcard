<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#EEF1F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="World Time">
<title>World Time</title>
<style>
  :root{
    --bg:#EAEEF2; --card:#FFFFFF; --soft:#F3F6F9; --line:#DCE2E8;
    --ink:#111922; --sec:#3C4A57; --mute:#6A7783; --accent:#0E5FA8; --amber:#9A6500;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0; background:var(--bg)}
  body{
    color:var(--ink); font-family:var(--mono); line-height:1.3;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) 14px env(safe-area-inset-left);
    max-width:520px; margin:0 auto;
  }
  header{padding:12px 16px 6px}
  .kicker{font-size:10px; letter-spacing:.22em; color:var(--mute); text-transform:uppercase; font-weight:700}
  h1{font-size:17px; letter-spacing:.08em; margin:3px 0 0; font-weight:700}

  .list{margin:4px 14px 0; background:var(--card); border:1px solid var(--line); border-radius:13px; overflow:hidden}
  .row{
    display:flex; align-items:center; gap:10px; padding:9px 14px;
    border-top:1px solid var(--line);
  }
  .row:first-child{border-top:none}
  .name{flex:1; min-width:0; font-weight:700; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .day{flex:none; font-size:11px; font-weight:700; color:var(--mute); width:30px}
  .time{flex:none; width:112px; text-align:right; font-weight:700; font-size:15px; color:var(--ink); font-variant-numeric:tabular-nums; white-space:nowrap}
  .off{flex:none; width:66px; text-align:left; font-size:11px; font-weight:700; color:var(--accent); white-space:nowrap}
</style>
</head>
<body>
<header>
  <div class="kicker">World Time &middot; v6</div>
  <h1>WORLD TIME</h1>
</header>
<div class="list" id="list"></div>

<script>
const CITIES = [
  ["Auburn","America/Chicago"],
  ["Atlanta","America/New_York"],
  ["Denver","America/Denver"],
  ["Los Angeles","America/Los_Angeles"],
  ["Honolulu","Pacific/Honolulu"],
  ["Seoul","Asia/Seoul"],
  ["Tokyo","Asia/Tokyo"],
  ["Santiago","America/Santiago"],
  ["Cape Town","Africa/Johannesburg"],
  ["Johannesburg","Africa/Johannesburg"],
  ["London","Europe/London"],
  ["Paris","Europe/Paris"],
  ["Rome","Europe/Rome"],
  ["Amsterdam","Europe/Amsterdam"],
];
const LOCAL_TZ = (Intl.DateTimeFormat().resolvedOptions().timeZone) || "UTC";
const listEl=document.getElementById("list");

function getParts(date, tz){
  const f=new Intl.DateTimeFormat("en-US",{timeZone:tz,hourCycle:"h23",
    year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"});
  const o={}; f.formatToParts(date).forEach(p=>{ if(p.type!=="literal") o[p.type]=p.value; });
  return o;
}
function offsetMin(p, date){ const u=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second); return Math.round((u-date.getTime())/60000); }
function fmt12(p){ let h=+p.hour; const ap=h>=12?"PM":"AM"; let hh=h%12; if(hh===0)hh=12; return `${hh}:${p.minute}:${p.second} ${ap}`; }
function offLabel(min){ const s=min>=0?"+":"\u2212"; const a=Math.abs(min); const h=Math.floor(a/60), m=a%60; return `UTC${s}${h}${m?":"+String(m).padStart(2,"0"):""}`; }
const wdFmt={};
function weekday(date, tz){ if(!wdFmt[tz]) wdFmt[tz]=new Intl.DateTimeFormat("en-US",{timeZone:tz,weekday:"short"}); return wdFmt[tz].format(date); }

let rows=[];
CITIES.forEach(([name,tz])=>{
  const row=document.createElement("div"); row.className="row";
  const n=document.createElement("div"); n.className="name"; n.textContent=name;
  const day=document.createElement("div"); day.className="day";
  const time=document.createElement("div"); time.className="time"; time.textContent="\u2014";
  const off=document.createElement("div"); off.className="off";
  row.appendChild(n); row.appendChild(day); row.appendChild(time); row.appendChild(off);
  listEl.appendChild(row);
  rows.push({tz, timeEl:time, offEl:off, dayEl:day});
});

function tick(){
  const now=new Date();
  rows.forEach(r=>{
    const p=getParts(now, r.tz);
    r.dayEl.textContent=weekday(now, r.tz);
    r.timeEl.textContent=fmt12(p);
    r.offEl.textContent=offLabel(offsetMin(p, now));
  });
}
tick();
setInterval(tick, 1000);
</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
