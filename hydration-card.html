<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#EEF1F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hydration">
<title>Hydration</title>
<style>
  :root{
    --bg:#EAEEF2; --card:#FFFFFF; --soft:#F3F6F9; --line:#D6DDE4;
    --ink:#111922; --sec:#3C4A57; --mute:#6A7783;
    --go:#0E8A4C; --goTint:#E4F4EB; --amber:#9A6500; --amberTint:#FBF1DD;
    --salt:#1668A8; --night:#5A3FA0; --nightTint:#EEE9F8; --accent:#0E5FA8;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0; background:var(--bg)}
  body{
    color:var(--ink); font-family:var(--mono); font-size:14.5px; line-height:1.35;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) 24px env(safe-area-inset-left);
    max-width:520px; margin:0 auto;
  }
  header{padding:10px 16px 2px; display:flex; align-items:center; gap:12px}
  .htext{flex:1; min-width:0}
  .kicker{font-size:10px; letter-spacing:.22em; color:var(--mute); text-transform:uppercase; font-weight:700}
  h1{font-size:17px; letter-spacing:.08em; margin:3px 0 0; font-weight:700}
  .clear{
    flex:none; padding:8px 14px; background:var(--card); color:var(--sec);
    border:1px solid var(--line); border-radius:9px; font-family:var(--mono);
    font-size:11px; letter-spacing:.1em; text-transform:uppercase; cursor:pointer; font-weight:700;
  }
  .clear:active{background:var(--soft)}

  .seg{display:flex; gap:6px; padding:0 16px; margin-top:6px}
  .opt{flex:1; padding:10px 4px; border:1px solid var(--line); background:var(--soft); color:var(--sec); border-radius:10px; font-family:var(--mono); font-size:12.5px; font-weight:700; letter-spacing:.03em; cursor:pointer}
  .opt.on{background:var(--card); color:var(--ink); border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}

  .pin{display:none; padding:6px 16px 0}
  .pin.show{display:block}
  .prow{display:flex; align-items:center; gap:10px; margin-top:6px}
  .field{display:flex; align-items:center; gap:8px}
  .prow .field{flex:none}
  #wakeField{margin-top:6px}
  .field label{flex:none; min-width:42px; font-size:11px; font-weight:700; letter-spacing:.06em; color:var(--sec); text-transform:uppercase}
  .field input{flex:none; width:130px; font-family:var(--mono); font-size:15px; font-weight:700; color:var(--ink); border:1px solid var(--line); border-radius:9px; padding:8px 10px; background:var(--card)}
  .field.hide{display:none}
  .nt{flex:none; margin-left:auto; display:flex; align-items:center; gap:6px}
  .nt span{font-size:10px; font-weight:700; letter-spacing:.08em; color:var(--mute); text-transform:uppercase}
  .mini{flex:none; padding:8px 12px; border:1px solid var(--line); background:var(--soft); color:var(--mute); border-radius:8px; font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.06em; cursor:pointer; text-transform:uppercase}
  .mini.on{background:var(--accent); color:#fff; border-color:var(--accent)}

  .gobar{
    margin:10px 16px 0; padding:9px 16px; background:var(--goTint);
    border:1px solid var(--line); border-top:3px solid var(--go);
    border-radius:12px; display:flex; align-items:center; gap:10px;
  }
  .gobar .lbl{font-size:10px; letter-spacing:.2em; color:var(--sec); font-weight:700}
  .gobar .time{font-size:24px; font-weight:700; color:var(--go); letter-spacing:.02em}
  .gobar .win{margin-left:auto; font-size:11px; color:var(--sec); font-weight:700}
  .note{padding:7px 16px 3px; color:var(--sec); font-size:11.5px}

  .list{margin:5px 16px 0; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden}
  .shead{padding:7px 13px 4px; font-size:9.5px; letter-spacing:.16em; font-weight:700; color:var(--mute); text-transform:uppercase; border-top:1px solid var(--line); background:var(--soft)}
  .shead:first-child{border-top:none}
  .shead.night{color:var(--night)}
  .row{display:flex; align-items:center; gap:10px; padding:8px 13px; border-top:1px solid var(--line); cursor:pointer}
  .row:first-child{border-top:none}
  .box{flex:none; width:21px; height:21px; border-radius:5px; border:1.5px solid #B7C1CB; display:flex; align-items:center; justify-content:center; background:var(--card); transition:.12s; font-size:13px; color:#fff; font-weight:700}
  .row.done .box{background:var(--go); border-color:var(--go)}
  .box::after{content:"\2713"; opacity:0}
  .row.done .box::after{opacity:1}
  .time{flex:none; width:74px; font-weight:700; color:var(--ink); font-size:13px}
  .act{flex:1; color:var(--ink); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .row.done .act{color:var(--mute); text-decoration:line-through}
  .amt{flex:none; color:var(--salt); font-weight:700; white-space:nowrap; font-size:13px}
  .row.done .amt{color:#9AA7B2; text-decoration:line-through}
  .tail{display:flex; align-items:center; gap:8px; padding:9px 13px; border-top:1px solid var(--line); background:var(--amberTint); color:var(--amber); font-weight:700; font-size:12px}
  .tail.night{background:var(--nightTint); color:var(--night)}
  :focus-visible{outline:2px solid var(--go); outline-offset:2px}
</style>
</head>
<body>
<header>
  <div class="htext">
    <div class="kicker">Hydration &middot; v5 &middot; ~165 lb</div>
    <h1>WATER &amp; SALT &middot; GO</h1>
  </div>
  <button class="clear" id="clear">Clear</button>
</header>

<div class="seg" id="modeSeg">
  <button class="opt on" data-v="now">Start now</button>
  <button class="opt" data-v="plan">Plan go time</button>
</div>

<div class="pin" id="planInputs">
  <div class="prow">
    <div class="field"><label>Go</label><input type="time" id="goIn" step="900"></div>
    <div class="nt"><span>Night</span><button class="mini" id="wakeOff">Off</button><button class="mini on" id="wakeOn">On</button></div>
  </div>
  <div class="field" id="wakeField"><label>Wake</label><input type="time" id="wakeIn" step="900" value="06:00"></div>
</div>

<div class="seg" id="stateSeg">
  <button class="opt on" data-v="hyd">Hydrated</button>
  <button class="opt" data-v="mild">Mild deficit</button>
  <button class="opt" data-v="alc">Alcohol</button>
</div>

<div class="gobar" id="gobar">
  <span class="lbl">GO</span>
  <span class="time" id="goTime">&mdash;</span>
  <span class="win" id="goWin"></span>
</div>
<div class="note" id="note"></div>
<div class="list" id="list"></div>

<script>
const STATE={
  hyd: {label:"Hydrated",     win:240, opener:"12 oz \u00b7 1/8 tsp", oz:12, ozLast:8,  potassium:false},
  mild:{label:"Mild deficit", win:270, opener:"14 oz \u00b7 1/4 tsp", oz:12, ozLast:10, potassium:false},
  alc: {label:"Alcohol",      win:360, opener:"16 oz \u00b7 1/4 tsp", oz:14, ozLast:10, potassium:true},
};

const store={ get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}} };
const KEY="hydration.session";
let mode="now", state="hyd", useWake=true, lockedStart=null;
let checks={};
let _restored=null;
(function(){ const s=store.get(KEY,null); if(s){ _restored=s; mode=s.mode||"now"; state=s.state||"hyd"; useWake=s.useWake!==false; lockedStart=(typeof s.lockedStart==="number")?s.lockedStart:null; checks=s.checks||{}; } })();

const $=(id)=>document.getElementById(id);
const modeSeg=$("modeSeg"), stateSeg=$("stateSeg"), planInputs=$("planInputs");
const goIn=$("goIn"), wakeIn=$("wakeIn"), wakeField=$("wakeField"), wakeOff=$("wakeOff"), wakeOn=$("wakeOn");
const goTimeEl=$("goTime"), goWinEl=$("goWin"), noteEl=$("note"), listEl=$("list");

function fmt(min){ min=((Math.round(min)%1440)+1440)%1440; let h=Math.floor(min/60), m=min%60; const ap=h>=12?"PM":"AM"; let hh=h%12; if(hh===0)hh=12; return `${hh}:${m.toString().padStart(2,"0")} ${ap}`; }
function parseT(v){ if(!v) return null; const [h,m]=v.split(":").map(Number); return h*60+m; }
function toHHMM(min){ min=((Math.round(min)%1440)+1440)%1440; const h=Math.floor(min/60), m=min%60; return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`; }
function snap15(m){ return Math.round(m/15)*15; }
function snap5(m){ return Math.round(m/5)*5; }
function nowMin(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function rowLabel(act, amt){ if(act && /coffee/i.test(act)) return "Coffee"; if(amt && /(tsp|pinch)/i.test(amt)) return "Salt water"; return "Water"; }

function buildMorning(start, go, cfg){
  const M=[];
  M.push({t:start, amt:cfg.opener});
  M.push({t:start+20, act:"Coffee", amt:"12 oz"});
  const lastDrink=go-45;
  let t=start+80; const waters=[];
  while(t<=lastDrink-25){ waters.push(t); t+=70; }
  waters.forEach((wt,i)=>{
    const salted = i < Math.ceil(waters.length/2);
    const oz = (i<waters.length-1)?cfg.oz:cfg.ozLast;
    M.push({t:wt, amt: salted?`${oz} oz \u00b7 1/8 tsp`:`${oz} oz`});
  });
  if(lastDrink>=start+40) M.push({t:lastDrink, amt:"6 oz"});
  return {steps:M, lastDrink};
}

function compute(){
  const cfg=STATE[state];
  let start, go, night=[], nightTail="", includeNight=false, ctx="";
  if(mode==="now"){
    if(lockedStart==null) lockedStart=snap5(nowMin());
    start=lockedStart;
    go=start+cfg.win;
    ctx=`Start ${fmt(start)} \u00b7 ${cfg.label} \u00b7 go in ${(cfg.win/60).toFixed(1)} hr`;
  } else {
    const gv=parseT(goIn.value);
    if(gv==null) return {error:"Set a go time."};
    go=snap15(gv);
    if(useWake){
      const wv=parseT(wakeIn.value);
      if(wv==null) return {error:"Set a wake time."};
      const wake=snap15(wv);
      if(go<=wake) return {error:"Go time must be after wake."};
      start=wake;
      const bed=wake-510, window=go-wake;
      includeNight = window<300;
      if(includeNight){
        night=[
          {t:bed-240, amt:"14 oz \u00b7 1/8 tsp"},
          {t:bed-180, amt:"10 oz"},
          {t:bed-120, amt:"8 oz \u00b7 pinch"},
        ];
        nightTail=`Last sip by ${fmt(bed-120)} \u2014 2 hr before bed \u2192 pee before sleep, less night waking.`;
        ctx=`Bed ${fmt(bed)} (8.5 hr) \u00b7 wake ${fmt(wake)} \u00b7 night-prior included`;
      } else {
        ctx=`Wake ${fmt(wake)} \u00b7 morning-only \u2014 window \u22655 hr`;
      }
    } else {
      start=go-cfg.win;
      ctx=`Start ${fmt(start)} \u00b7 ${cfg.label} \u00b7 backward-planned`;
    }
  }
  const {steps:morning, lastDrink}=buildMorning(start, go, cfg);
  const morningTail=`Sip only after ${fmt(lastDrink>=start+40?lastDrink:go)} \u2192 empty bladder before GO.`;
  let note=ctx;
  if(cfg.potassium) note += " \u00b7 add potassium early (banana / salted toast)";
  return {go, start, night, nightTail, includeNight, morning, morningTail, note};
}

function appendHead(txt, night){ const h=document.createElement("div"); h.className="shead"+(night?" night":""); h.textContent=txt; listEl.appendChild(h); }
function appendRow(r, i){
  const row=document.createElement("div"); row.className="row"+(checks[i]?" done":"");
  const label=rowLabel(r.act, r.amt);
  row.innerHTML=`<div class="box"></div><div class="time">${fmt(r.t)}</div><div class="act">${label}</div><div class="amt">${r.amt}</div>`;
  row.onclick=()=>{ checks[i]=!checks[i]; save(); render(); };
  listEl.appendChild(row);
}
function appendTail(txt, night){ const t=document.createElement("div"); t.className="tail"+(night?" night":""); t.innerHTML=`<span>\u25B8</span><b>${txt}</b>`; listEl.appendChild(t); }

function setSeg(seg, val){ [...seg.children].forEach(b=> b.classList.toggle("on", b.dataset.v===val)); }

function render(){
  setSeg(modeSeg, mode); setSeg(stateSeg, state);
  planInputs.classList.toggle("show", mode==="plan");
  wakeOff.classList.toggle("on", !useWake); wakeOn.classList.toggle("on", useWake);
  wakeField.classList.toggle("hide", !(mode==="plan" && useWake));
  listEl.innerHTML="";
  const p=compute();
  if(p.error){ goTimeEl.textContent="\u2014"; goWinEl.textContent=""; noteEl.textContent=p.error; return; }
  goTimeEl.textContent=fmt(p.go);
  goWinEl.textContent=((p.go-p.start)/60).toFixed(1)+" hr";
  noteEl.textContent=p.note;
  let idx=0;
  if(p.includeNight){
    appendHead("Night prior", true);
    p.night.forEach(r=>appendRow(r, idx++));
    appendTail(p.nightTail, true);
    appendHead("Morning", false);
  }
  p.morning.forEach(r=>appendRow(r, idx++));
  appendTail(p.morningTail);
}

function save(){ store.set(KEY,{mode,state,useWake,lockedStart,checks,goVal:goIn.value,wakeVal:wakeIn.value}); }
function changed(){ checks={}; if(mode==="now") lockedStart=snap5(nowMin()); save(); render(); }

[...modeSeg.children].forEach(b=> b.onclick=()=>{ mode=b.dataset.v; changed(); });
[...stateSeg.children].forEach(b=> b.onclick=()=>{ state=b.dataset.v; changed(); });
wakeOff.onclick=()=>{ useWake=false; changed(); };
wakeOn.onclick=()=>{ useWake=true; changed(); };
goIn.oninput=changed;
wakeIn.oninput=changed;
goIn.onchange=()=>{ const v=parseT(goIn.value); if(v!=null) goIn.value=toHHMM(snap15(v)); changed(); };
wakeIn.onchange=()=>{ const v=parseT(wakeIn.value); if(v!=null) wakeIn.value=toHHMM(snap15(v)); changed(); };
$("clear").onclick=()=>{ checks={}; if(mode==="now") lockedStart=snap5(nowMin()); save(); render(); };

if(_restored){ if(_restored.goVal) goIn.value=_restored.goVal; if(_restored.wakeVal) wakeIn.value=_restored.wakeVal; }
if(!goIn.value) goIn.value=toHHMM(snap15(nowMin()+240));
if(mode==="now" && lockedStart==null) lockedStart=snap5(nowMin());
save();
render();
</script>
</body>
</html>
